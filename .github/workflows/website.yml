name: Website
on:
  push:
    branches: [main]
    paths: ['src/**', 'shared/**', 'worker/**', 'migrations/**', 'public/**', 'tests/**', 'package*.json', '*config*', 'index.html', 'scripts/prepare-deploy.mjs', '.github/workflows/website.yml']
  pull_request:
    paths: ['src/**', 'shared/**', 'worker/**', 'tests/**', 'package*.json', '*config*', 'index.html']
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [validate, cloudflare, github-pages]
        default: validate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  cloudflare:
    needs: validate
    if: (github.event_name == 'push' && vars.CLOUDFLARE_D1_DATABASE_ID != '') || inputs.target == 'cloudflare'
    runs-on: ubuntu-latest
    concurrency:
      group: production-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      BRIDGE_ENABLED: ${{ vars.BRIDGE_ENABLED }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment authentication
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm ci
      - run: npm run deploy

  github-pages:
    needs: validate
    if: github.event_name == 'push' || inputs.target == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_DEPLOYMENT_TARGET: github-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy
